<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Socio</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui;background:#060d09}.card{background:#0d1a12;border:1px solid #1c3526;border-radius:1rem}input{min-height:52px}.btn-main{background:linear-gradient(135deg,#22c55e,#16a34a)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f2a1a;border:1px solid #22c55e;padding:12px 20px;border-radius:24px;display:none;z-index:100}</style></head><body class="text-white min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="card p-6 w-full max-w-sm"><div class="text-5xl text-center mb-3">👤</div><h2 class="font-black text-2xl text-center">Panel <span class="text-green-500">Socio</span></h2><input id="u" placeholder="Usuario" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="p" type="password" placeholder="Contraseña" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none"><button id="btnLogin" onclick="login()" class="w-full btn-main py-3.5 rounded-xl font-bold">Entrar →</button><p id="loginErr" class="text-red-400 text-xs mt-3 text-center"></p></div></div>
<div id="panel" style="display:none" class="p-3 max-w-md mx-auto pb-10">
<div class="card p-5 mb-3 flex justify-between items-center"><div><div class="text-[11px] text-gray-400">Socio</div><div id="uname" class="font-black text-xl text-green-400"></div><div class="text-[11px] text-gray-500 cursor-pointer" data-u="" id="copyMe" onclick="copyT(this.dataset.u)">👆 copiar mi usuario</div></div><div class="text-right"><div class="text-[11px] text-gray-400">Mi saldo</div><div class="text-3xl font-black text-green-400">₲<span id="bal">0</span></div></div></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">👥 Clientes — toca para copiar</h3><input id="searchCli" oninput="renderClients()" placeholder="🔍 Buscar..." class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><div id="cliList" class="max-h-64 overflow-y-auto"></div></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">💸 Cargar / Quitar saldo</h3><input id="cli" placeholder="Usuario cliente" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="amt" type="number" placeholder="Monto ₲ (mín 1000)" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none"><button onclick="moverSaldo(1)" class="w-full btn-main py-3.5 rounded-xl font-bold mb-2">⚡ Cargar</button><button onclick="moverSaldo(-1)" class="w-full bg-red-600/15 border border-red-500/30 py-3 rounded-xl font-bold text-sm text-red-300">➖ Quitar</button></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">🔑 Enviar Key</h3><input id="k_cli" placeholder="Usuario" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="k_svc" placeholder="Servicio" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="k_val" placeholder="Key" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none font-mono"><button onclick="enviarKey()" class="w-full btn-main py-3.5 rounded-xl font-bold">📩 Enviar</button></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">📜 Movimientos</h3><div id="moves" class="space-y-2 text-sm"></div></div>
<button onclick="logout()" class="w-full bg-red-600/15 border border-red-500/30 py-3 rounded-xl font-bold text-sm text-red-300">↪ Salir</button></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,addDoc,query,where,onSnapshot,orderBy,limit,runTransaction} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyA3LaesYHXylgoXtHCJWwmo_Ucl6SdZlpc",authDomain:"my-project-modz.firebaseapp.com",projectId:"my-project-modz"}));
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){let t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200);}
window.copyT=t=>{navigator.clipboard.writeText(t);toast('📋 '+t);};
let RU='',clients=[];
const validAmount=v=>{v=Math.floor(Number(v));return v>=1000?v:0;};
function showPanel(){$('login').style.display='none';$('panel').style.display='block';$('uname').textContent=RU;$('copyMe').dataset.u=RU;onSnapshot(doc(db,"resellers",RU),s=>{if(s.exists())$('bal').textContent=(s.data().balance||0).toLocaleString();});loadClients();loadMoves();}
function loadClients(){onSnapshot(query(collection(db,"moves"),where("reseller","==",RU),orderBy("date","desc"),limit(100)),s=>{let m={};s.forEach(d=>m[d.data().client]=1);clients=Object.keys(m);renderClients();});}
window.renderClients=()=>{let q=($('searchCli').value||'').toLowerCase();let h='';clients.filter(c=>c.toLowerCase().includes(q)).slice(0,50).forEach(c=>{h+=`<div class="flex justify-between items-center p-2 border-b border-white/5"><div data-u="${esc(c)}" onclick="copyT(this.dataset.u);document.getElementById('cli').value=this.dataset.u;document.getElementById('k_cli').value=this.dataset.u" style="cursor:pointer"><b>👆 ${esc(c)}</b></div><button onclick="document.getElementById('cli').value='${esc(c)}';document.getElementById('amt').focus()" class="bg-green-600 px-3 py-1 rounded-lg text-xs font-bold">Usar</button></div>`;});$('cliList').innerHTML=h||'<p class="text-gray-500 text-xs text-center py-3">Sin clientes aún</p>';};
function loadMoves(){onSnapshot(query(collection(db,"moves"),where("reseller","==",RU),orderBy("date","desc"),limit(40)),s=>{let h='';s.forEach(d=>{let m=d.data();h+=`<div class="bg-black/25 p-3 rounded-xl flex justify-between"><b data-u="${esc(m.client)}" onclick="copyT(this.dataset.u)" style="cursor:pointer">👆 ${esc(m.client)}</b><span class="${m.amount<0?'text-red-400':'text-green-400'} font-bold">₲${Number(m.amount).toLocaleString()}</span></div>`;});$('moves').innerHTML=h||'<p class="text-gray-500 text-xs text-center">Sin movimientos</p>';});}
window.moverSaldo=async(sign)=>{let client=$('cli').value.trim().toLowerCase(),a=validAmount($('amt').value);if(!client||!a)return toast('⚠️ Mínimo ₲1000');if(!confirm((sign>0?'Cargar ₲':'Quitar ₲')+a.toLocaleString()+' a '+client+'?'))return;try{await runTransaction(db,async t=>{let fr=doc(db,"resellers",RU),tr=doc(db,"users",client);let fs=await t.get(fr),ts=await t.get(tr);let fb=fs.data().balance||0;if(sign>0&&fb<a)throw new Error('Sin saldo');t.update(fr,{balance:sign>0?fb-a:fb+a});t.set(tr,{username:client,balance:Math.max(0,(ts.exists()?ts.data().balance||0:0)+sign*a)},{merge:true});});await addDoc(collection(db,"moves"),{reseller:RU,client,amount:sign*a,date:new Date().toISOString()});toast('✅');$('cli').value='';$('amt').value='';}catch(e){toast('❌ '+(e.message||e));}};
window.enviarKey=async()=>{let c=$('k_cli').value.trim().toLowerCase(),s=$('k_svc').value.trim(),k=$('k_val').value.trim();if(!c||!s||!k)return toast('⚠️ Completa');await addDoc(collection(db,"orders"),{user:c,service:s,key:k,status:"done",date:new Date().toISOString(),reseller:RU});toast('✅');$('k_cli').value='';$('k_svc').value='';$('k_val').value='';};
window.login=async()=>{try{let u=$('u').value.trim().toLowerCase(),pw=$('p').value;let d=await getDoc(doc(db,"resellers",u));if(!d.exists()||d.data().pass!==pw)throw new Error('Datos incorrectos');RU=u;localStorage.setItem('nj_socio_sess',RU);showPanel();}catch(e){$('loginErr').textContent=e.message;}};
window.logout=()=>{localStorage.removeItem('nj_socio_sess');location.reload();};
(async()=>{let s=localStorage.getItem('nj_socio_sess');if(!s)return;let d=await getDoc(doc(db,"resellers",s));if(d.exists()){RU=s;showPanel();}})();
</script></body></html>
