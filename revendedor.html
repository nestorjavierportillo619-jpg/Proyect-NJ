<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Revendedor - NJ Premium</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><style>
body{font-family:Inter,system-ui;background:#060d09}.card{background:#0d1a12;border:1px solid #1c3526;border-radius:1.1rem}input{min-height:52px}.btn-main{background:linear-gradient(135deg,#22c55e,#16a34a)}.btn-main:active{transform:scale(.98)}.btn-main:disabled{opacity:.5}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f2a1a;border:1px solid #22c55e;padding:12px 20px;border-radius:24px;display:none;z-index:100;font-weight:600;max-width:90%}</style></head><body class="text-white min-h-screen">
<div id="login" class="min-h-screen flex items-center justify-center p-4"><div class="card p-6 w-full max-w-sm"><div class="text-5xl text-center mb-3">🤝</div><h2 class="font-black text-2xl text-center">Panel <span class="text-green-500">Revendedor</span></h2><input id="u" placeholder="Usuario" autocapitalize="off" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="p" type="password" placeholder="Contraseña" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none"><button id="btnLogin" onclick="login()" class="w-full btn-main py-3.5 rounded-xl font-bold">Entrar →</button><p id="loginErr" class="text-red-400 text-xs mt-3 text-center"></p></div></div>
<div id="panel" style="display:none" class="p-3 max-w-md mx-auto pb-10">
<div class="card p-5 mb-3 flex justify-between items-center"><div><div class="text-[11px] text-gray-400">Revendedor</div><div id="uname" class="font-black text-xl text-green-400"></div></div><div class="text-right"><div class="text-[11px] text-gray-400">Mi saldo</div><div class="text-3xl font-black text-green-400">₲<span id="bal">0</span></div></div></div>
<div id="contactCard" style="display:none" class="card p-4 mb-3"><div class="font-bold text-sm mb-1">💬 ¿Sin saldo? Pide al admin</div><div class="text-[11px] text-gray-400 mb-3">Recarga por WhatsApp o Telegram</div><div class="flex gap-2"><a id="waAdmin" href="#" target="_blank" class="flex-1 text-center btn-main px-4 py-3 rounded-xl font-bold text-sm">WhatsApp 📲</a><a id="tgAdmin" href="#" target="_blank" style="display:none" class="flex-1 text-center bg-sky-600/20 border border-sky-500/30 px-4 py-3 rounded-xl font-bold text-sm">Telegram ✈️</a></div></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">💸 Cargar / Quitar saldo</h3><input id="cli" placeholder="Usuario cliente (nombre exacto)" autocapitalize="off" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="amt" type="number" placeholder="Monto ₲" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none"><button id="btnCargar" onclick="moverSaldo(1)" class="w-full btn-main py-3.5 rounded-xl font-bold mb-2">⚡ Cargar saldo</button><button id="btnQuitar" onclick="moverSaldo(-1)" class="w-full bg-red-600/15 border border-red-500/30 py-3 rounded-xl font-bold text-sm text-red-300">➖ Quitar saldo</button></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">👥 Crear socio</h3><input id="s_user" placeholder="Usuario del socio" autocapitalize="off" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="s_pass" placeholder="Contraseña del socio" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none"><button onclick="crearSocio()" class="w-full btn-main py-3.5 rounded-xl font-bold">➕ Crear socio</button><div id="sociosList" class="space-y-2 text-sm mt-3"></div></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">🔑 Enviar Key</h3><input id="k_cli" placeholder="Usuario cliente (nombre exacto)" autocapitalize="off" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="k_svc" placeholder="Servicio" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-2 outline-none"><input id="k_val" placeholder="Key / código" class="w-full bg-black/40 p-3 rounded-xl text-sm border border-white/10 mb-3 outline-none font-mono"><button id="btnKey" onclick="enviarKey()" class="w-full btn-main py-3.5 rounded-xl font-bold">📩 Enviar</button></div>
<div class="card p-5 mb-3"><h3 class="font-bold text-sm mb-3">📜 Movimientos</h3><div id="moves" class="space-y-2 text-sm"></div></div>
<button onclick="logout()" class="w-full bg-red-600/15 border border-red-500/30 py-3 rounded-xl font-bold text-sm text-red-300">↪ Salir</button>
</div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import {getFirestore,doc,getDoc,setDoc,updateDoc,collection,addDoc,query,where,onSnapshot,orderBy,limit,runTransaction,getDocs} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyA3LaesYHXylgoXtHCJWwmo_Ucl6SdZlpc",authDomain:"my-project-modz.firebaseapp.com",projectId:"my-project-modz"}));
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){let t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
let RU='',BAL=0,WA='',TG='';
async function findUserByName(name){let q=query(collection(db,"users"),where("username","==",name),limit(1));let s=await getDocs(q);if(s.empty){let q2=query(collection(db,"users"),where("username","==",name.toLowerCase()),limit(1));s=await getDocs(q2);}return s.empty?null:{id:s.docs[0].id,...s.docs[0].data()};}
function pedirSaldoWA(){let wa=String(WA||'').replace(/\D/g,'');if(!wa&&!TG)return toast('❌ Sin saldo suficiente');let msg=`Hola admin, soy revendedor ${RU} necesito recarga de saldo`;if(wa)window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`,'_blank');else window.open(`https://t.me/${String(TG).replace('@','')}`,'_blank');}
function showPanel(){$('login').style.display='none';$('panel').style.display='block';$('uname').textContent=RU;$('bal').textContent=BAL.toLocaleString();loadMoves();loadSocios();loadContactos();}
function loadMoves(){onSnapshot(query(collection(db,"moves"),where("reseller","==",RU),orderBy("date","desc"),limit(40)),s=>{let h='';s.forEach(d=>{let m=d.data();h+=`<div class="bg-black/25 p-3 rounded-xl flex justify-between text-sm"><b>${esc(m.client)}</b><span class="font-bold ${m.amount<0?'text-red-400':'text-green-400'}">${m.amount<0?'':' +'}₲${Number(m.amount).toLocaleString()}</span></div>`;});$('moves').innerHTML=h||'<p class="text-gray-500 text-xs text-center">Sin movimientos</p>';});}
function loadSocios(){onSnapshot(query(collection(db,"resellers"),where("createdBy","==",RU),limit(30)),s=>{let h='';s.forEach(d=>{let r=d.data();h+=`<div class="bg-black/25 p-3 rounded-xl flex justify-between items-center"><b>${esc(d.id)}</b><span class="text-green-400 font-bold text-xs">₲${Number(r.balance||0).toLocaleString()}</span></div>`;});$('sociosList').innerHTML=h?'<div class="text-[11px] text-gray-400 font-bold">Mis socios:</div>'+h:'';});}
async function loadContactos(){try{let d=await getDoc(doc(db,"config","contactos"));if(!d.exists())return;WA=d.data().whatsapp||'';TG=d.data().telegram||'';let wa=String(WA).replace(/\D/g,'');if(!wa&&!TG)return;$('contactCard').style.display='block';if(wa)$('waAdmin').href=`https://wa.me/${wa}?text=${encodeURIComponent("Hola admin, soy revendedor "+RU+" necesito saldo")}`;else $('waAdmin').style.display='none';if(TG){$('tgAdmin').style.display='block';$('tgAdmin').href=`https://t.me/${String(TG).replace('@','')}`;}}catch(e){}}
window.crearSocio=async()=>{let nu=$('s_user').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,''),pw=$('s_pass').value.trim();if(nu.length<3)return toast('⚠️ Usuario mínimo 3 letras');if(pw.length<4)return toast('⚠️ Clave mínima 4 caracteres');let ex=await getDoc(doc(db,"resellers",nu));if(ex.exists())return toast('❌ Ya existe');if(!confirm(`Crear socio "${nu}"?`))return;await setDoc(doc(db,"resellers",nu),{user:nu,pass:pw,balance:0,createdBy:RU,createdAt:new Date().toISOString()});await addDoc(collection(db,"admin_log"),{actor:RU,accion:"crear_socio",detalle:`Creó socio ${nu}`,date:new Date().toISOString()});$('s_user').value='';$('s_pass').value='';toast('✅ Socio '+nu+' creado');};
window.moverSaldo=async(sign)=>{let btn=sign===1?$('btnCargar'):$('btnQuitar');if(btn.disabled)return;let target=$('cli').value.trim(),amount=Math.floor(Number($('amt').value));if(!target||!amount||amount<1000)return toast('⚠️ Datos inválidos (mín 1000)');if(!confirm(`${sign===1?'Cargar':'Quitar'} ₲${amount.toLocaleString()} ${sign===1?'a':'a'} ${target}?`))return;btn.disabled=true;try{let socioSnap=await getDoc(doc(db,"resellers",target.toLowerCase()));let isSocio=socioSnap.exists()&&socioSnap.data().createdBy===RU;await runTransaction(db,async t=>{let rRef=doc(db,"resellers",RU);let rS=await t.get(rRef);let rBal=rS.data().balance||0;if(sign===1){if(rBal<amount)throw new Error('❌ No tienes saldo suficiente');t.update(rRef,{balance:rBal-amount});}else{t.update(rRef,{balance:rBal+amount});}if(isSocio){let dRef=doc(db,"resellers",target.toLowerCase());let dS=await t.get(dRef);let nb=(dS.data().balance||0)+sign*amount;if(nb<0)nb=0;t.update(dRef,{balance:nb});}});if(!isSocio){let u=await findUserByName(target);if(!u)throw new Error('❌ Cliente no encontrado. Debe iniciar sesión primero en la tienda.');await runTransaction(db,async t=>{let rRef=doc(db,"resellers",RU);let uRef=doc(db,"users",u.id);let rS=await t.get(rRef);let uS=await t.get(uRef);let rBal=rS.data().balance||0;let uBal=uS.data().balance||0;if(sign===1){if(rBal<amount)throw new Error('❌ No tienes saldo');t.update(rRef,{balance:rBal-amount});t.update(uRef,{balance:uBal+amount});}else{let nb=uBal-amount;if(nb<0)nb=0;t.update(uRef,{balance:nb});t.update(rRef,{balance:rBal+amount});}});}await addDoc(collection(db,"moves"),{reseller:RU,client:target,amount:sign*amount,date:new Date().toISOString()});$('cli').value='';$('amt').value='';toast('✅ Listo');}catch(e){toast(e.message||'Error');if((e.message||'').includes('No tienes saldo'))pedirSaldoWA();}btn.disabled=false;};
window.enviarKey=async()=>{let b=$('btnKey');if(b.disabled)return;let c=$('k_cli').value.trim(),s=$('k_svc').value.trim(),k=$('k_val').value.trim();if(!c||!s||!k)return toast('⚠️ Completa');b.disabled=true;try{let u=await findUserByName(c);if(!u)return toast('❌ Cliente no encontrado');await addDoc(collection(db,"orders"),{uid:u.id,user:u.username||c,service:s,key:k,total_gs:0,price_gs:0,status:"done",date:new Date().toISOString(),reseller:RU});toast('✅ Enviada a '+u.username);$('k_cli').value='';$('k_svc').value='';$('k_val').value='';}catch(e){toast(e.message);}b.disabled=false;};
window.login=async()=>{let b=$('btnLogin');b.disabled=true;b.textContent='Entrando...';try{let u=$('u').value.trim().toLowerCase(),pw=$('p').value;let d=await getDoc(doc(db,"resellers",u));if(!d.exists()||d.data().pass!==pw)throw '❌ Datos incorrectos';RU=u;BAL=d.data().balance||0;localStorage.setItem('nj_res_sess',RU);showPanel();onSnapshot(doc(db,"resellers",RU),s=>{if(s.exists()){BAL=s.data().balance||0;$('bal').textContent=BAL.toLocaleString();}});}catch(e){$('loginErr').textContent=e;b.disabled=false;b.textContent='Entrar →';}};
window.logout=()=>{localStorage.removeItem('nj_res_sess');location.reload();};
(async()=>{let s=localStorage.getItem('nj_res_sess');if(!s)return;let d=await getDoc(doc(db,"resellers",s));if(!d.exists())return;RU=s;BAL=d.data().balance||0;showPanel();onSnapshot(doc(db,"resellers",RU),sx=>{if(sx.exists()){BAL=sx.data().balance||0;$('bal').textContent=BAL.toLocaleString();}});})();
</script></body></html>
