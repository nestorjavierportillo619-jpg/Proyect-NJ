<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saldo</title>
<style>*{box-sizing:border-box;margin:0;font-family:system-ui}body{background:#060d09;color:#fff}.wrap{max-width:600px;margin:auto;padding:18px}.card{background:#0d1a12;border:1px solid #1c3526;border-radius:16px;padding:16px}input{width:100%;padding:13px;background:#08130d;border:1px solid #1c3526;color:#fff;border-radius:12px;margin:6px 0}.btn{background:#22c55e;color:#fff;border:0;padding:13px;border-radius:12px;font-weight:800;width:100%}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:12px;border-radius:12px;background:#0a150e;color:#8fb89f;text-align:center;cursor:pointer;font-weight:800}.tab.active{background:#22c55e;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #1c3526}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f2a1a;border:1px solid #22c55e;padding:12px 20px;border-radius:20px;display:none}</style></head><body><div class="wrap">
<div id="lock" class="card" style="margin-top:60px;text-align:center"><h2>🔒 PIN</h2><input id="pin" type="password" style="text-align:center"><button class="btn" onclick="unlock()">Entrar</button></div>
<div id="main" style="display:none"><h2>💰 Saldo</h2><div class="tabs"><div class="tab active" id="tab-u" onclick="setT('u')">Usuarios</div><div class="tab" id="tab-r" onclick="setT('r')">Revendedores</div><div class="tab" id="tab-s" onclick="setT('s')">Socios</div></div><input id="q" oninput="render()" placeholder="Buscar..."><div class="card"><div id="list"></div></div></div></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import {getFirestore,collection,doc,getDoc,updateDoc,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyA3LaesYHXylgoXtHCJWwmo_Ucl6SdZlpc",authDomain:"my-project-modz.firebaseapp.com",projectId:"my-project-modz"}));const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){let t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
let PIN="1234";(async()=>{let d=await getDoc(doc(db,"config","saldo"));if(d.exists())PIN=d.data().pin||PIN;})();
window.unlock=()=>{if($('pin').value===PIN){$('lock').style.display='none';$('main').style.display='block';}else toast('❌');};
let tipo='u',users=[],resellers=[];const validAmount=v=>{v=Math.floor(Number(v));return v>=1000?v:0;};
onSnapshot(collection(db,"users"),s=>{users=[];s.forEach(d=>users.push({id:d.id,...d.data()}));render();});
onSnapshot(collection(db,"resellers"),s=>{resellers=[];s.forEach(d=>resellers.push({id:d.id,...d.data()}));render();});
window.setT=t=>{tipo=t;['u','r','s'].forEach(x=>$('tab-'+x).classList.toggle('active',x===t));render();};
window.copyU=el=>{navigator.clipboard.writeText(el.dataset.u);toast('📋 '+el.dataset.u);};
window.mod=async(col,id,sign)=>{let a=validAmount(prompt((sign>0?'Cargar ₲:':'Quitar ₲:')));if(!a)return toast('⚠️ Mínimo 1000');await runTransaction(db,async t=>{let s=await t.get(doc(db,col,id));let nb=(s.data().balance||0)+sign*a;if(nb<0)nb=0;t.update(doc(db,col,id),{balance:nb});});toast('✅');};
function row(name,bal,col,id){return `<div class="row"><div data-u="${esc(id)}" onclick="copyU(this)" style="cursor:pointer"><b>👆 ${esc(name)}</b><br><span style="color:#22c55e">₲${Number(bal).toLocaleString()}</span></div><div><button onclick="mod('${col}','${esc(id)}',1)">+ Cargar</button> <button onclick="mod('${col}','${esc(id)}',-1)">- Quitar</button></div></div>`;}
function render(){let q=($('q').value||'').toLowerCase();let h='';if(tipo==='u')users.filter(u=>(u.username||'').toLowerCase().includes(q)).slice(0,50).forEach(u=>h+=row(u.username,u.balance,'users',u.id));else if(tipo==='r')resellers.filter(r=>!r.createdBy&&r.id.includes(q)).forEach(r=>h+=row(r.id,r.balance,'resellers',r.id));else resellers.filter(r=>r.createdBy&&r.id.includes(q)).forEach(r=>h+=row(r.id,r.balance,'resellers',r.id));$('list').innerHTML=h||'Sin resultados';}
</script></body></html>
