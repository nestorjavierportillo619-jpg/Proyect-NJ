<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NJ Premium</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><style>:root{--a:#22c55e;--bg:#060d09;--card:#0d1a12;--b:#1c3526;--mut:#8fb89f}*{box-sizing:border-box;margin:0;font-family:Inter,system-ui}body{background:var(--bg);color:#fff}.nav{position:sticky;top:0;background:rgba(6,13,9,.95);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b);z-index:10}.btn{background:var(--a);color:#041008;border:0;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer;width:100%}.btn-login{background:linear-gradient(135deg,#22c55e,#16a34a)!important;color:#fff!important;border:0}.btn:disabled{opacity:.5}.hero{text-align:center;padding:40px 20px;background:radial-gradient(500px 250px at 50% 0%,rgba(34,197,94,.18),transparent)}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:16px}table{width:100%;border-collapse:collapse}td{padding:12px;border-top:1px solid var(--b);text-align:left;vertical-align:middle}input{width:100%;padding:12px;background:#08130d;border:1px solid var(--b);color:#fff;border-radius:10px;margin:6px 0}#modal,#accModal,#profileModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:99}.box{background:var(--card);border:1px solid var(--b);padding:20px;border-radius:18px;max-width:400px;width:100%}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f2a1a;border:1px solid var(--a);padding:10px 18px;border-radius:20px;display:none;z-index:100}.footer{max-width:500px;margin:30px auto;padding:0 16px 40px}.prod-img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex-shrink:0}.cat-head{background:#0a150e!important;font-weight:800;color:var(--a)!important;font-size:14px}.user-chip{background:#0f2a1a;border:1px solid var(--a);color:var(--a);padding:10px 14px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin-bottom:4px;scrollbar-width:none}.cat-bar::-webkit-scrollbar{display:none}.cat-chip{white-space:nowrap;padding:9px 16px;border-radius:20px;border:1px solid var(--b);background:#0a150e;color:var(--mut);font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.cat-chip.active{background:var(--a);color:#041008;border-color:var(--a);font-weight:800}.btn-cancel{width:100%;background:#182230;border:1px solid #2e425a;color:#fff;margin-top:12px;cursor:pointer;padding:17px;border-radius:14px;font-weight:800;font-size:17px}.btn-confirm{padding:17px!important;font-size:17px!important;border-radius:14px!important}</style></head><body>
<div class="nav"><b>NJ <span style="color:var(--a)">PREMIUM</span></b><div style="display:flex;gap:8px;align-items:center"><div id="saldoBox" style="display:none;color:#22c55e;font-weight:800;background:#0f2a1a;border:1px solid #22c55e;padding:10px 14px;border-radius:14px;font-size:14px">₲ 0</div><div id="userArea"><button onclick="openAcc()" class="btn btn-login" style="width:auto;padding:10px 18px;border-radius:14px;font-size:14px">Iniciar sesión</button></div></div></div>
<div class="hero"><h1>Servicios <span style="color:var(--a)">Premium</span></h1><p style="color:var(--mut);margin:8px 0 16px">Entrega inmediata • Soporte 24/7</p><button class="btn" style="width:auto;padding:14px 32px;border-radius:14px" onclick="document.getElementById('svcCard').scrollIntoView({behavior:'smooth'})">Ver servicios</button></div>
<div class="wrap"><div class="card" id="svcCard"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px"><h3>Catálogo</h3><div style="display:flex;gap:8px"><a href="keys.html" class="cat-chip">🔑 Mis Keys</a><a href="pedidos.html" class="cat-chip">📦 Mis pedidos</a></div></div><div id="catBar" class="cat-bar"></div><input id="search" placeholder="🔍 Buscar productos..."><table><tbody id="tb"></tbody></table><p id="emptyMsg" style="color:var(--mut);text-align:center;padding:20px;display:none">Sin productos.</p></div></div>
<div class="footer"><div class="card"><h3 style="margin-bottom:12px">Soporte</h3><button class="btn" onclick="openTg()" style="margin-bottom:10px;border-radius:14px;padding:14px;background:linear-gradient(135deg,#229ED9,#1a7fb5);color:#fff">Telegram oficial</button><button class="btn" onclick="recharge()" style="border-radius:14px;padding:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff">💬 Recargar saldo por WhatsApp</button></div><p style="text-align:center;color:var(--mut);font-size:12px">© NJ Premium</p></div>
<div id="accModal"><div class="box" style="text-align:center"><h2>Bienvenido</h2><p style="color:var(--mut);font-size:13px;margin-bottom:16px">Inicia con Google, tu cuenta se crea automática</p><button onclick="loginGoogle()" class="btn" style="padding:14px;border-radius:14px;margin-bottom:10px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;gap:10px"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px"> Continuar con Google</button><button onclick="closeM('accModal')" style="background:none;border:0;color:#888;cursor:pointer">Cerrar</button></div></div>
<div id="profileModal"><div class="box" style="text-align:center"><h3>Mi cuenta</h3><img id="pPhoto" style="width:64px;height:64px;border-radius:50%;margin:8px"><div id="pUsername" style="font-weight:800"></div><small id="pEmail" style="color:var(--mut)"></small><div style="background:#0a150e;border:1px solid var(--b);padding:14px;border-radius:12px;margin:12px 0"><small style="color:var(--mut)">Saldo</small><br><b id="pSaldo" style="color:#22c55e;font-size:24px">₲ 0</b></div><button onclick="recharge()" class="btn btn-login" style="padding:14px;border-radius:14px;margin-bottom:10px">💬 Recargar por WhatsApp</button><button onclick="closeM('profileModal')" style="width:100%;background:#1c3526;color:#fff;border:0;padding:15px;border-radius:14px;font-weight:800;cursor:pointer">✕ Cerrar</button><button onclick="logout()" style="width:100%;background:#2a1215;border:1px solid #ff555522;color:#ff7b7b;padding:14px;border-radius:14px;margin-top:8px;cursor:pointer">↪ Cerrar sesión</button></div></div>
<div id="modal"><div class="box"><div id="mImgWrap" style="margin-bottom:10px"></div><h3 id="mt"></h3><p id="md" style="color:var(--mut);font-size:13px"></p><p id="mp" style="color:var(--a);font-weight:800;font-size:20px;margin:8px 0"></p><p style="color:var(--mut);font-size:13px;background:#0a150e;padding:10px;border-radius:10px;border:1px solid var(--b)">🔑 La key llegará a <b style="color:var(--a)">Mis Keys</b></p><button class="btn btn-login btn-confirm" id="cbtn">✅ Confirmar compra</button><button class="btn-cancel" onclick="closeM('modal')">✕ Cancelar</button></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import {getFirestore,collection,doc,getDoc,setDoc,addDoc,onSnapshot,query,orderBy,limit,runTransaction} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyA3LaesYHXylgoXtHCJWwmo_Ucl6SdZlpc",authDomain:"my-project-modz.firebaseapp.com",projectId:"my-project-modz"}));const auth=getAuth();await setPersistence(auth,browserLocalPersistence);
const provider=new GoogleAuthProvider();const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validImg=u=>typeof u==='string'&&u.startsWith('http')?u:'';const DEF_PHOTO='https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg';
let prods=[],cur=null,selectedCat='Todos',currentUid=null,searchT=null;
function toast(m){let t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
window.openAcc=()=>$('accModal').style.display='flex';window.closeM=id=>$(id).style.display='none';
['modal','accModal','profileModal'].forEach(id=>$(id).addEventListener('click',e=>{if(e.target.id===id)closeM(id);}));
setInterval(()=>{if(currentUid)import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js').then(()=>{});},2*60*1000);
window.loginGoogle=async()=>{try{await signInWithPopup(auth,provider);}catch(e){try{await signInWithRedirect(auth,provider);}catch(e2){toast(e.message);return;}}};
onAuthStateChanged(auth,async fb=>{if(fb){currentUid=fb.uid;const ref=doc(db,"users",fb.uid);const s=await getDoc(ref);if(!s.exists()){await setDoc(ref,{username:fb.displayName,email:fb.email,photo:fb.photoURL||'',balance:0,created:new Date().toISOString(),last_seen:new Date().toISOString()});toast('✅ Cuenta creada');}$('accModal').style.display='none';onSnapshot(ref,s2=>{let bal=s2.exists()?(s2.data().balance||0):0;$('saldoBox').style.display='block';$('saldoBox').textContent='₲ '+Number(bal).toLocaleString();$('userArea').innerHTML=`<div class="user-chip" onclick="document.getElementById('profileModal').style.display='flex'"><img src="${fb.photoURL||DEF_PHOTO}" style="width:24px;height:24px;border-radius:50%">${esc((fb.displayName||'User').split(' ')[0])}</div>`;$('pPhoto').src=fb.photoURL||DEF_PHOTO;$('pUsername').textContent=fb.displayName||'';$('pEmail').textContent=fb.email||'';$('pSaldo').textContent='₲ '+Number(bal).toLocaleString();});}else{currentUid=null;$('saldoBox').style.display='none';$('userArea').innerHTML=`<button onclick="openAcc()" class="btn btn-login" style="width:auto;padding:10px 18px;border-radius:14px;font-size:14px">Iniciar sesión</button>`;}});
window.logout=()=>signOut(auth).then(()=>closeM('profileModal'));
window.setCat=c=>{selectedCat=c;render();};
$('search').addEventListener('input',()=>{clearTimeout(searchT);searchT=setTimeout(render,200);});
function render(){let cats=['Todos',...new Set(prods.map(p=>p.catalog||'General'))];$('catBar').innerHTML=cats.map(c=>`<button class="cat-chip ${selectedCat===c?'active':''}" data-c="${esc(c)}" onclick="setCat(this.dataset.c)">${c==='Todos'?'✨ Todos':esc(c)}</button>`).join('');let q=$('search').value.toLowerCase();let f=prods.filter(p=>{let ok=selectedCat==='Todos'||(p.catalog||'General')===selectedCat;return ok&&((p.name||'')+' '+(p.desc||'')).toLowerCase().includes(q);});$('emptyMsg').style.display=f.length?'none':'block';let gc=[...new Set(f.map(p=>p.catalog||'General'))];$('tb').innerHTML=gc.map(cat=>`<tr><td colspan="3" class="cat-head">📁 ${esc(cat)}</td></tr>`+f.filter(p=>(p.catalog||'General')===cat).map(p=>{let im=validImg(p.img);let pr=Number(p.price_gs||0);return `<tr><td><div style="display:flex;gap:10px;align-items:center">${im?`<img src="${im}" class="prod-img" loading="lazy">`:''}<div><b>${esc(p.name)}</b><br><small style="color:var(--mut)">${esc(p.desc||'')}</small></div></div></td><td style="color:var(--a);font-weight:800;white-space:nowrap">₲${pr.toLocaleString()}</td><td><button class="btn btn-login" style="width:auto;padding:8px 14px" data-id="${esc(p.id)}" onclick="buyOpen(this.dataset.id)">Comprar</button></td></tr>`;}).join('')).join('');}
window.buyOpen=id=>{cur=prods.find(p=>p.id===id);if(!cur)return;if(!currentUid){openAcc();return toast('Inicia sesión');}$('mt').textContent=cur.name||'';$('md').textContent=cur.desc||'';$('mp').textContent='₲'+Number(cur.price_gs||0).toLocaleString();let im=validImg(cur.img);$('mImgWrap').innerHTML=im?`<img src="${im}" style="width:100%;height:160px;object-fit:cover;border-radius:12px">`:'';$('modal').style.display='flex';let b=$('cbtn');b.disabled=false;b.onclick=doBuy;};
async function doBuy(){let b=$('cbtn');if(b.disabled)return;b.disabled=true;try{let price=Number(cur.price_gs||0);if(!price)throw new Error('Precio inválido');await runTransaction(db,async t=>{let ref=doc(db,"users",currentUid);let s=await t.get(ref);let bal=s.exists()?(s.data().balance||0):0;if(bal<price)throw new Error('❌ Saldo insuficiente');t.update(ref,{balance:bal-price});let oref=doc(collection(db,"orders"));t.set(oref,{uid:currentUid,user:s.data().username||'',service:cur.name,total_gs:price,price_gs:price,status:'pending',key:'',date:new Date().toISOString()});});closeM('modal');toast('✅ Pedido creado, pendiente de entrega');location.href='pedidos.html';}catch(e){toast(e.message||'Error');b.disabled=false;}}
window.recharge=async()=>{let wa='';try{let s=await getDoc(doc(db,"config","contactos"));wa=s.exists()?(s.data().whatsapp||''):'';if(!wa){let m=await getDoc(doc(db,"config","main"));wa=m.exists()?(m.data().whatsapp||''):'';}}catch(e){}wa=String(wa||'').replace(/\D/g,'');if(!wa)return toast('WhatsApp no configurado');let fb=auth.currentUser;let msg=fb?`Hola, quiero recargar. Soy ${fb.displayName} (${fb.email}) UID:${fb.uid}`:'Hola, quiero recargar';window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');};
window.openTg=async()=>{let s=await getDoc(doc(db,"config","main"));let tg=s.exists()?s.data().telegram:'';if(!tg)return toast('No configurado');window.open(tg,'_blank');};
onSnapshot(query(collection(db,"products"),orderBy("created","desc"),limit(100)),s=>{prods=s.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.is_visible!==false);render();},e=>{$('tb').innerHTML=`<tr><td>Error cargando: ${esc(e.message)}</td></tr>`;});
</script></body></html>
