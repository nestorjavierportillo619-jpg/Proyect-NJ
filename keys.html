<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Keys - NJ Premium</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet"><style>:root{--a:#22c55e;--bg:#060d09;--card:#0d1a12;--b:#1c3526}*{box-sizing:border-box;margin:0;font-family:Inter,system-ui}body{background:var(--bg);color:#fff}.nav{padding:14px 16px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#060d09}.wrap{max-width:600px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:12px}.key-code{font-family:monospace;background:#00000066;padding:10px;border-radius:10px;color:var(--a);font-weight:800;word-break:break-all;margin:8px 0;user-select:all}.btn{background:var(--a);color:#041008;border:0;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer;width:100%}.back{background:#0a150e;border:1px solid var(--b);color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700}</style></head><body>
<div class="nav"><button class="back" onclick="location.href='index.html'">← Volver</button><b>🔑 Mis Keys</b></div>
<div class="wrap" id="list"><div class="card">Cargando...</div></div>
<script>
window.copyKey=async(t=>{try{await navigator.clipboard.writeText(t);}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}let d=document.createElement('div');d.textContent='✅ Copiada';d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f2a1a;border:1px solid #22c55e;padding:10px 18px;border-radius:20px;z-index:100;font-weight:700';document.body.appendChild(d);setTimeout(()=>d.remove(),1500);});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import {getFirestore,collection,query,where,orderBy,limit,onSnapshot} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyA3LaesYHXylgoXtHCJWwmo_Ucl6SdZlpc",authDomain:"my-project-modz.firebaseapp.com",projectId:"my-project-modz"}));const auth=getAuth();await setPersistence(auth,browserLocalPersistence);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{try{let f=d?.toDate?d.toDate():new Date(d);return f.toLocaleString();}catch(e){return '';}};
window.loginGoogle=async()=>{await signInWithPopup(auth,new GoogleAuthProvider());};
onAuthStateChanged(auth,user=>{
if(!user){document.getElementById('list').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:40px">🔑</div><b>Inicia sesión</b><br><br><button class="btn" onclick="loginGoogle()">Continuar con Google</button></div>`;return;}
const q=query(collection(db,"orders"),where("uid","==",user.uid),orderBy("date","desc"),limit(50));
onSnapshot(q,s=>{let k=[];s.forEach(d=>{let o=d.data();if(o.key)k.push(o);});document.getElementById('list').innerHTML=k.length?k.map(x=>`<div class="card"><b>${esc(x.service)}</b><br><small style="color:#8fb89f">${fmtDate(x.date)}</small><div class="key-code">${esc(x.key)}</div><button class="btn" data-key="${esc(x.key)}" onclick="copyKey(this.dataset.key)">📋 Copiar key</button></div>`).join(''):'<div class="card">Aún no tienes keys.</div>';},e=>{document.getElementById('list').innerHTML=`<div class="card">⚠️ Falta índice<br><small>${esc(e.message)}</small></div>`;});
});
</script></body></html>
